packages:
  - apps/*
  - services/*
  - packages/*
  - tools/*
# Install scripts run only for packages set to true here.
allowBuilds:
  # Cloudflare's local runtime and its bundler check their platform binaries at install.
  esbuild: true
  workerd: true
  # Native add-ons that wallet SDK dependencies ask to compile. The browser bundle doesn't use them,
  # and each has a JavaScript fallback.
  bufferutil: false
  keccak: false
  utf-8-validate: false
overrides:
  # wagmi's WalletConnect connector asks for this: the logger's own pino has a vulnerable dependency.
  "@walletconnect/logger>pino": 10.0.0
