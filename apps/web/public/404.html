<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Not found | Vayle</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #e4e7f1;
        --sheet: #ffffff;
        --ink: #04060f;
        --muted: #5b6072;
        --brand-text: #253cef;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #05070d;
          --sheet: #0b0e18;
          --ink: #eef1f9;
          --muted: #8e95aa;
          --brand-text: #6879fd;
        }
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        background: var(--page);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(440px, 100%);
        padding: 32px;
        box-sizing: border-box;
        border-radius: 28px;
        background: var(--sheet);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        color: var(--brand-text);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>There's no page here</h1>
      <p>The link may be old, or the address mistyped.</p>
      <a href="/">Go to Vayle</a>
    </main>
  </body>
</html>
