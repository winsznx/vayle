[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The core composes every module into one contract, which needs the IR pipeline for stack depth.
via_ir = true
# The chain's own limit, chain.maxCodeSize in deployments/robinhood-mainnet.json.
code_size_limit = 98304
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read", path = "./out" },
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[fmt]
line_length = 100

[lint]
ignore = ["test/**/*.sol"]
# Timestamps are the protocol clock: calendar closes, exercise windows and liveness gaps.
exclude_lints = ["block-timestamp"]
