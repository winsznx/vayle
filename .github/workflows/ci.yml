name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Names and private paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Scan files, commit messages, branch and pull request text
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          DENYLIST_COMMON: ${{ secrets.DENYLIST_COMMON }}
          VAYLE_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          VAYLE_CI_PR_TITLE: ${{ github.event.pull_request.title }}
          VAYLE_CI_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$DENYLIST" ]; then printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"; fi
          if [ -n "$DENYLIST_COMMON" ]; then printf '%s\n' "$DENYLIST_COMMON" > "$RUNNER_TEMP/denylist-common.txt"; fi
          export VAYLE_DENYLIST="$RUNNER_TEMP/denylist.txt"
          export VAYLE_DENYLIST_COMMON="$RUNNER_TEMP/denylist-common.txt"
          node packages/repo-guard/src/cli.ts ci

  node:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Lint
        working-directory: contracts
        run: forge lint
      # Sizes are checked against the chain's own limits by test/Deployables.t.sol, since
      # forge build --sizes only knows the 24,576-byte mainnet Ethereum limit.
      - name: Build
        working-directory: contracts
        run: forge build
      - name: Test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: forge test -vvv

  slither:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: medium
