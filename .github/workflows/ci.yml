name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Names and private paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Scan files, commit messages, branch and pull request text
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          DENYLIST_COMMON: ${{ secrets.DENYLIST_COMMON }}
          VAYLE_CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          VAYLE_CI_PR_TITLE: ${{ github.event.pull_request.title }}
          VAYLE_CI_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$DENYLIST" ]; then printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"; fi
          if [ -n "$DENYLIST_COMMON" ]; then printf '%s\n' "$DENYLIST_COMMON" > "$RUNNER_TEMP/denylist-common.txt"; fi
          export VAYLE_DENYLIST="$RUNNER_TEMP/denylist.txt"
          export VAYLE_DENYLIST_COMMON="$RUNNER_TEMP/denylist-common.txt"
          node packages/repo-guard/src/cli.ts ci

  node:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        # Type-aware lint loads every package's types at once, past Node's default heap here.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Tests against the live chain
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: pnpm -r --if-present test:chain

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Lint
        working-directory: contracts
        run: forge lint
      # Sizes are checked against the chain's own limits by test/Deployables.t.sol, since
      # forge build --sizes only knows the 24,576-byte mainnet Ethereum limit.
      - name: Build
        working-directory: contracts
        run: forge build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The public RPC's Cloudflare front challenges forge's HTTP client, so forge reads through a
      # local relay that sends each request with curl and retries refusals.
      - name: Start the RPC relay
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: |
          node tools/rpc-relay/src/relay.ts > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8547 -X POST -d '{}' && break; sleep 1; done
      - name: Generated ABIs match the contracts
        run: node packages/abi/src/generate.ts --check
      - name: Test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
          ROBINHOOD_RPC_URL: http://127.0.0.1:8547
        # One recent block for every fork test, so forge's RPC cache serves repeated reads.
        run: FORK_BLOCK="$(cast block-number --rpc-url "$ROBINHOOD_RPC_URL")" forge test -vvv

  markets:
    name: Lifecycle and invariants for every other listed market
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The public RPC's Cloudflare front challenges forge's HTTP client, so forge reads through a
      # local relay that sends each request with curl and retries refusals.
      - name: Start the RPC relay
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: |
          node tools/rpc-relay/src/relay.ts > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8547 -X POST -d '{}' && break; sleep 1; done
      - name: Test each market in deployments/markets.json beyond the first
        working-directory: contracts
        env:
          ROBINHOOD_RPC_URL: http://127.0.0.1:8547
        # The contracts job covers the first market. Each other one runs the lifecycle campaigns
        # and invariant suites on its own token, at one recent block.
        run: |
          export FORK_BLOCK="$(cast block-number --rpc-url "$ROBINHOOD_RPC_URL")"
          for symbol in $(node -p 'require("../deployments/markets.json").markets.slice(1).map((m) => m.symbol).join(" ")'); do
            echo "::group::$symbol"
            FORK_MARKET="$symbol" forge test --match-path "test/campaigns/*" -vvv
            echo "::endgroup::"
          done

  interface:
    name: Holder flow through the shared call builders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      # The public RPC's Cloudflare front challenges forge's HTTP client, so forge reads through a
      # local relay that sends each request with curl and retries refusals.
      - name: Start the RPC relay
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: |
          node tools/rpc-relay/src/relay.ts > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8547 -X POST -d '{}' && break; sleep 1; done
      - name: Test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: interface
          ROBINHOOD_RPC_URL: http://127.0.0.1:8547
        run: FORK_BLOCK="$(cast block-number --rpc-url "$ROBINHOOD_RPC_URL")" forge test --match-path "test/interface/*" -vvv

  slither:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: medium
